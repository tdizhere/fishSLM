<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guppy Chat</title>
  <style>
    :root {
      --bg: #061b2e;
      --panel: #0b2942;
      --line: #24506d;
      --ink: #ebf8ff;
      --muted: #94b4c8;
      --aqua: #74dfd4;
      --coral: #f2a16f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font: 16px/1.55 system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% -20%, #195173, transparent 47%),
        var(--bg);
    }

    main {
      width: min(900px, 100%);
      min-height: 100vh;
      margin: auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      min-height: 72px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: -.04em;
    }

    #status {
      color: var(--muted);
      font-size: .82rem;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 42px 0 190px;
    }

    .message {
      max-width: 680px;
      margin: 0 0 28px;
      animation: appear .2s ease-out;
    }

    .message.user {
      margin-left: auto;
      text-align: right;
    }

    .label {
      margin-bottom: 7px;
      color: var(--aqua);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .user .label { color: var(--coral); }

    .bubble {
      margin: 0;
      white-space: pre-wrap;
    }

    .user .bubble {
      display: inline-block;
      padding: 11px 15px;
      text-align: left;
      background: rgba(116, 223, 212, .1);
      border: 1px solid rgba(116, 223, 212, .18);
      border-radius: 16px 16px 3px 16px;
    }

    .thinking {
      color: var(--muted);
      letter-spacing: .18em;
    }

    .fish-zone {
      position: fixed;
      right: 4vw;
      bottom: 110px;
      pointer-events: none;
      opacity: .92;
    }

    #fish {
      width: 190px;
      filter: drop-shadow(0 15px 18px rgba(0,0,0,.25));
      animation: swim 5s ease-in-out infinite, float 2s ease-in-out infinite;
    }

    #fish.thinking {
      animation-play-state: paused;
      transform: rotate(3deg);
    }

    form {
      position: fixed;
      z-index: 2;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(720px, calc(100% - 40px));
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(6, 27, 46, .95);
      backdrop-filter: blur(10px);
    }

    textarea {
      resize: none;
      min-height: 42px;
      max-height: 120px;
      padding: 9px;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font: inherit;
    }

    button {
      min-width: 82px;
      border: 0;
      border-radius: 11px;
      color: #06202c;
      background: var(--aqua);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled, textarea:disabled {
      opacity: .45;
      cursor: wait;
    }

    .note {
      position: fixed;
      bottom: 3px;
      left: 0;
      width: 100%;
      color: var(--muted);
      text-align: center;
      font-size: .7rem;
    }

    @keyframes swim {
      50% { transform: translateX(-18px) rotate(3deg); }
    }

    @keyframes float {
      50% { margin-bottom: 10px; }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .fish-zone { opacity: .45; right: -45px; }
      #fish { width: 150px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>~ guppy</h1>
      <span id="status">Loading tokenizer…</span>
    </header>

    <section id="chat" aria-live="polite">
      <article class="message">
        <div class="label">Guppy</div>
        <p class="bubble">Hi. I’m loading locally in your browser.</p>
      </article>
    </section>
  </main>

  <div class="fish-zone" aria-hidden="true">
    <svg id="fish" viewBox="0 0 280 150">
      <defs>
        <linearGradient id="body" x1="0" x2="1">
          <stop stop-color="#f6d675"/>
          <stop offset=".55" stop-color="#ef956b"/>
          <stop offset="1" stop-color="#bd5b82"/>
        </linearGradient>
      </defs>
      <path fill="#c95d87" d="M62 75C26 47 13 23 6 12c39 7 64 23 81 46-10 7-18 13-25 17zm0 0C28 102 14 128 6 140c39-7 64-24 81-47-10-6-18-12-25-18z"/>
      <path fill="url(#body)" d="M51 75c27-35 76-46 130-34 47 10 78 34 90 34-19 16-46 33-88 40-57 9-105-8-132-40z"/>
      <path fill="none" stroke="rgba(96,37,92,.4)" stroke-width="8" stroke-linecap="round" d="M112 46c-9 21-8 44 3 66m28-71c-10 24-8 52 5 75m25-72c-10 22-8 47 3 69"/>
      <circle cx="200" cy="63" r="8" fill="#14222e"/>
      <circle cx="203" cy="60" r="2.5" fill="white"/>
    </svg>
  </div>

  <form id="form">
    <textarea id="input" placeholder="Message Guppy…" maxlength="280" disabled></textarea>
    <button id="send" disabled>Send</button>
  </form>
  <div class="note">Runs locally · no messages leave your browser</div>

  <script type="module">
    import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.mjs";

    const MODEL_URL = "./model.onnx";
    const TOKENIZER_URL = "./tokenizer.json";

    const MAX_SEQ_LEN = 128;
    const MAX_NEW_TOKENS = 32;
    const TEMPERATURE = 0.7;
    const TOP_K = 50;

    /*
      Leave false unless the TRAINING CODE included category in the prompt.

      If the exact training prompt was:
      "category: curious\nwhat are you looking at"
      then set this true and provide a real category classifier.
    */
    const INCLUDE_CATEGORY = false;

    const chat = document.querySelector("#chat");
    const input = document.querySelector("#input");
    const send = document.querySelector("#send");
    const fish = document.querySelector("#fish");
    const status = document.querySelector("#status");

    let session;
    let tokenizer;
    let busy = false;

    function addMessage(role, text) {
      const item = document.createElement("article");
      item.className = `message ${role}`;

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = role === "user" ? "You" : "Guppy";

      const body = document.createElement("p");
      body.className = "bubble";
      body.textContent = text;

      item.append(label, body);
      chat.append(item);
      chat.scrollTop = chat.scrollHeight;
      return item;
    }

    function addThinking() {
      return addMessage("assistant", "thinking…");
    }

    class ByteLevelBPE {
      constructor(json) {
        this.vocab = json.model.vocab;
        this.idToToken = Object.fromEntries(
          Object.entries(this.vocab).map(([token, id]) => [id, token])
        );

        this.special = new Map(
          json.added_tokens
            .filter(token => token.special)
            .map(token => [token.content, token.id])
        );

        this.ranks = new Map(
          json.model.merges.map((pair, rank) => [
            Array.isArray(pair) ? pair.join(" ") : pair,
            rank
          ])
        );

        this.cache = new Map();
        this.byteEncoder = this.makeByteEncoder();
        this.byteDecoder = new Map(
          [...this.byteEncoder.entries()].map(([byte, character]) => [character, byte])
        );
      }

      makeByteEncoder() {
        const bytes = [];
        for (let i = 33; i <= 126; i++) bytes.push(i);
        for (let i = 161; i <= 172; i++) bytes.push(i);
        for (let i = 174; i <= 255; i++) bytes.push(i);

        const characters = [...bytes];
        let extra = 0;

        for (let i = 0; i < 256; i++) {
          if (!bytes.includes(i)) {
            bytes.push(i);
            characters.push(256 + extra++);
          }
        }

        return new Map(
          bytes.map((byte, index) => [byte, String.fromCodePoint(characters[index])])
        );
      }

      bpe(word) {
        if (this.cache.has(word)) return this.cache.get(word);

        let pieces = [...word];

        while (pieces.length > 1) {
          let bestRank = Infinity;
          let bestIndex = -1;

          for (let i = 0; i < pieces.length - 1; i++) {
            const rank = this.ranks.get(`${pieces[i]} ${pieces[i + 1]}`);
            if (rank !== undefined && rank < bestRank) {
              bestRank = rank;
              bestIndex = i;
            }
          }

          if (bestIndex < 0) break;
          pieces.splice(bestIndex, 2, pieces[bestIndex] + pieces[bestIndex + 1]);
        }

        this.cache.set(word, pieces);
        return pieces;
      }

      encodeText(text) {
        const pattern =
          /'s|'t|'re|'ve|'m|'ll|'d| ?[\p{L}]+| ?[\p{N}]+| ?[^\s\p{L}\p{N}]+|\s+(?!\S)|\s+/gu;

        const words = text.match(pattern) || [];
        const ids = [];

        for (const word of words) {
          const bytes = new TextEncoder().encode(word);
          const byteWord = Array.from(
            bytes,
            byte => this.byteEncoder.get(byte)
          ).join("");

          for (const token of this.bpe(byteWord)) {
            const id = this.vocab[token];
            if (id !== undefined) ids.push(id);
          }
        }

        return ids;
      }

      encode(text) {
        const escaped = [...this.special.keys()]
          .map(value => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
          .join("|");

        const parts = text.split(new RegExp(`(${escaped})`, "g"));
        const ids = [];

        for (const part of parts) {
          if (!part) continue;
          if (this.special.has(part)) {
            ids.push(this.special.get(part));
          } else {
            ids.push(...this.encodeText(part));
          }
        }

        return ids;
      }

      decode(ids) {
        const specialById = new Map(
          [...this.special.entries()].map(([token, id]) => [id, token])
        );

        let result = "";
        let bytes = [];

        const flush = () => {
          if (bytes.length) {
            result += new TextDecoder().decode(new Uint8Array(bytes));
            bytes = [];
          }
        };

        for (const id of ids) {
          if (specialById.has(id)) {
            flush();
            result += specialById.get(id);
            continue;
          }

          const token = this.idToToken[id] || "";
          for (const char of token) {
            const byte = this.byteDecoder.get(char);
            if (byte !== undefined) bytes.push(byte);
          }
        }

        flush();
        return result;
      }
    }

    function guessCategory(text) {
      const value = text.toLowerCase();

      if (/look|watch|see/.test(value)) return "curious";
      if (/friend|best friend/.test(value)) return "friends";
      if (/healthy|health|sick|feel ok/.test(value)) return "doctor";
      if (/snail|tankmate/.test(value)) return "snail";

      return "curious";
    }

    function makePrompt(userText) {
      const content = INCLUDE_CATEGORY
        ? `category: ${guessCategory(userText)}\n${userText}`
        : userText;

      return `<|im_start|>user\n${content}<|im_end|>\n<|im_start|>assistant\n`;
    }

    function sample(logits) {
      const candidates = [];

      for (let i = 0; i < logits.length; i++) {
        candidates.push([i, logits[i] / TEMPERATURE]);
      }

      candidates.sort((a, b) => b[1] - a[1]);
      const top = candidates.slice(0, TOP_K);
      const max = top[0][1];
      const weights = top.map(([, value]) => Math.exp(value - max));
      const sum = weights.reduce((total, value) => total + value, 0);

      let point = Math.random() * sum;

      for (let i = 0; i < top.length; i++) {
        point -= weights[i];
        if (point <= 0) return top[i][0];
      }

      return top[0][0];
    }

    async function generate(userText) {
      // Important: only the current prompt is sent.
      let ids = tokenizer.encode(makePrompt(userText));
      ids = ids.slice(-(MAX_SEQ_LEN - MAX_NEW_TOKENS));

      const generated = [];

      for (let step = 0; step < MAX_NEW_TOKENS; step++) {
        const tensor = new ort.Tensor(
          "int64",
          BigInt64Array.from(ids, BigInt),
          [1, ids.length]
        );

        const output = await session.run({ input_ids: tensor });
        const logits = output.logits;
        const vocabSize = logits.dims.at(-1);
        const lastLogits = logits.data.slice(logits.data.length - vocabSize);

        const next = sample(lastLogits);

        if (next === 1 || next === 2) break;

        generated.push(next);
        ids.push(next);

        if (ids.length > MAX_SEQ_LEN) ids.shift();
      }

      return tokenizer.decode(generated)
        .split("<|im_end|>")[0]
        .split("<|im_start|>")[0]
        .trim() || "blub.";
    }

    async function boot() {
      try {
        ort.env.wasm.wasmPaths =
          "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/";

        const tokenizerResponse = await fetch(TOKENIZER_URL);
        if (!tokenizerResponse.ok) throw new Error("tokenizer.json was not found");

        tokenizer = new ByteLevelBPE(await tokenizerResponse.json());

        status.textContent = "Loading model…";

        const modelResponse = await fetch(MODEL_URL);
        if (!modelResponse.ok) throw new Error("model.onnx was not found");

        session = await ort.InferenceSession.create(
          await modelResponse.arrayBuffer(),
          { executionProviders: ["wasm"] }
        );

        status.textContent = "Ready";
        input.disabled = false;
        send.disabled = false;
        input.focus();
      } catch (error) {
        console.error(error);
        status.textContent = "Could not load model";
        addMessage(
          "assistant",
          `Load error: ${error.message}. Open this through GitHub Pages or a local web server, not file://.`
        );
      }
    }

    document.querySelector("#form").addEventListener("submit", async event => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text || busy || !session) return;

      busy = true;
      input.disabled = true;
      send.disabled = true;
      fish.classList.add("thinking");

      addMessage("user", text);
      input.value = "";

      const thinking = addThinking();

      try {
        const reply = await generate(text);
        thinking.remove();
        addMessage("assistant", reply);
      } catch (error) {
        console.error(error);
        thinking.remove();
        addMessage("assistant", "My thought got tangled. Please try again.");
      } finally {
        busy = false;
        input.disabled = false;
        send.disabled = false;
        fish.classList.remove("thinking");
        input.focus();
      }
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        document.querySelector("#form").requestSubmit();
      }
    });

    boot();
  </script>
</body>
</html>
